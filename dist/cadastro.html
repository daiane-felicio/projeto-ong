<!doctypehtml><html lang=pt-BR><link href=style.css rel=stylesheet><meta charset=UTF-8><meta content="width=device-width,initial-scale=1"name=viewport><title>Cadastro - ONG Esperança</title><main><h1>Cadastro de Voluntários</h1><form><fieldset><legend>Dados pessoais</legend><label for=nome>Nome completo:</label> <input id=nome name=nome required> <label for=cpf>CPF:</label> <input id=cpf name=cpf required aria-describedby=ajuda-cpf pattern=\d{3}\.\d{3}\.\d{3}-\d{2} placeholder=000.000.000-00> <small id=ajuda-cpf>Formato: 000.000.000-00</small></fieldset><fieldset><legend>Contato</legend><label for=email>E-mail:</label> <input id=email name=email required type=email> <label for=telefone>Telefone:</label> <input id=telefone name=telefone required aria-describedby=ajuda-telefone pattern="\(\d{2}\) \d{5}-\d{4}"placeholder="(31) 99999-9999"type=tel> <small id=ajuda-telefone>Formato: (31) 99999-9999</small> <label for=cep>CEP:</label> <input id=cep name=cep required aria-describedby=ajuda-cep pattern=\d{5}-\d{3} placeholder=00000-000> <small id=ajuda-cep>Formato: 00000-000</small></fieldset><button type=submit>Enviar</button><div aria-live=polite class=feedback role=status><span aria-hidden=true>✓</span><p>Cadastro enviado com sucesso!</div></form></main><script src=js/main.js type=module></script>
